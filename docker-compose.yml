services:
  web:
    image: thekingziga/sejbosejbo:latest
    # Or build locally from source:
    # build: .
    container_name: sejbosejbo-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE:-sejbosejbo}
      - PGUSER=${PGUSER:-sejbosejbo}
      - PGPASSWORD=${PGPASSWORD:-sejbosejbopass}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - app_data:/app/data

  db:
    image: postgres:17-alpine
    container_name: sejbosejbo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-sejbosejbo}
      POSTGRES_PASSWORD: ${PGPASSWORD:-sejbosejbopass}
      POSTGRES_DB: ${PGDATABASE:-sejbosejbo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-sejbosejbo} -d ${PGDATABASE:-sejbosejbo}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  app_data:
